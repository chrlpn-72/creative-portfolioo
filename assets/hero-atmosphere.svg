<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <filter id="clouds" x="-15%" y="-20%" width="130%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0.34 0.34 0.34 0 0 0.34 0.34 0.34 0 0 0.34 0.34 0.34 0 0 0.45 0.45 0.45 0 -0.42" result="cloud-matte"/>
      <feGaussianBlur in="cloud-matte" stdDeviation="12" result="soft-clouds"/>
      <feFlood flood-color="#d2d0cb" result="cloud-tone"/>
      <feComposite in="cloud-tone" in2="soft-clouds" operator="in" result="cloud-layer"/>
      <feGaussianBlur in="cloud-layer" stdDeviation="3"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".4" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".72" stop-color="#fff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="cloud-fade">
      <rect width="1600" height="1000" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="1600" height="1000" fill="#fff" filter="url(#clouds)" mask="url(#cloud-fade)"/>
</svg>
